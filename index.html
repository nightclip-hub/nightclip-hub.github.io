<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <title>NightClip Hub — Exclusive 18+ Videos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0d0d12; color: #f3f4f6; min-height: 100vh; }
    header { background: #14141c; padding: 16px 20px; border-bottom: 1px solid #262633; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 20px; font-weight: 800; color: #fff; }
    .logo span { color: #e11d48; }
    .badge { background: #e11d48; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: #16161f; border: 1px solid #272736; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: #e11d48; }
    .thumb-wrap { position: relative; aspect-ratio: 16/9; background: #000; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.85); padding: 3px 7px; border-radius: 5px; font-size: 12px; font-weight: 600; }
    .play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.25); font-size: 38px; color: #fff; }
    .info { padding: 14px; }
    .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
    .meta { font-size: 12px; color: #9ca3af; }
    #ageGate { position: fixed; inset: 0; background: rgba(10,10,15,0.97); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .gate-box { background: #181822; border: 1px solid #2e2e3e; padding: 30px 24px; border-radius: 16px; max-width: 400px; width: 100%; }
    .gate-box h2 { margin-bottom: 10px; font-size: 22px; }
    .gate-box p { color: #9ca3af; font-size: 14px; margin-bottom: 22px; line-height: 1.5; }
    .btn-enter { background: #e11d48; color: #fff; border: none; width: 100%; padding: 13px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div id="ageGate">
    <div class="gate-box">
      <h2>🔞 18+ Age Verification</h2>
      <p>This website contains adult content. By entering, you confirm that you are 18 years of age or older.</p>
      <button class="btn-enter" onclick="document.getElementById('ageGate').style.display='none'">I am 18 or older — Enter</button>
    </div>
  </div>

  <header>
    <div class="logo">NightClip<span>Hub</span></div>
    <div class="badge">18+ HD</div>
  </header>

  <main class="grid" id="videoGrid"></main>

  <script src="videos.js"></script>
  <script>
    const grid = document.getElementById("videoGrid");
    if (typeof VIDEOS !== "undefined") {
      VIDEOS.forEach(v => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="thumb-wrap">
            <img src="${v.thumb}" alt="${v.title}">
            <div class="play-icon">▶</div>
            <span class="duration">${v.duration}</span>
          </div>
          <div class="info">
            <div class="title">${v.title}</div>
            <div class="meta">${v.views} views • HD</div>
          </div>
        `;
        card.onclick = () => {
          window.open("https://acidic-deal.com/bv3bV.0oP_3Op-vDbimjV_JMZbDt0E3/NWj/UOzwMOj/gm1BLoTKcW2MNxTwMxyYOJDnki", "_blank");
          window.location.href = v.embed;
        };
        grid.appendChild(card);
      });
    }
  </script>
  <script src="ad.js"></script>
</body>
</html>
